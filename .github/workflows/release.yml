name: Release

# Push a tag like v1.0.0 and this builds the macOS .dmg and Windows .exe,
# then attaches both to a GitHub Release. Run it manually to just get artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: build:mac
            files: dist/*.dmg
          - name: Windows
            os: windows-latest
            script: build
            files: dist/*.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.name }}
        run: npm run ${{ matrix.script }}
        env:
          # We don't ship signed builds yet — stop electron-builder looking for
          # a signing identity in CI (it would fail the macOS job).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kicaps-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          draft: true
          generate_release_notes: true
