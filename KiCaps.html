<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>KiCaps — Position Calculator</title>
<link rel="icon" type="image/png" href="icon.png">
<script src="lib/react.min.js"></script>
<script src="lib/react-dom.min.js"></script>
<!-- Fonts: bundled locally (variable + static woff2) — no network dependency -->
<style>
@font-face{ font-family:'Inter'; font-style:normal; font-weight:100 900; font-display:swap; src:url('lib/fonts/inter-var.woff2') format('woff2'); }
@font-face{ font-family:'JetBrains Mono'; font-style:normal; font-weight:100 800; font-display:swap; src:url('lib/fonts/jetbrains-mono-var.woff2') format('woff2'); }
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

/* ═══════════════════════════════════════
   DESIGN TOKENS — dark (theme A)
   ═══════════════════════════════════════ */
:root {
  --win-bg:#0b0c0e; --title-bg:#101214; --panel-bg:#0e1013; --panel2-bg:#15181c;
  --border:rgba(255,255,255,.10); --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.04);
  --text:#f1f3f5; --muted:#797f88; --faint:#565b63;
  --accent:#f2853d; --accent-text:#1a1206; --accent-tint:rgba(242,133,61,.16);
  --green:#57b981; --red:#ff6a58; --live:#57b981; --track:rgba(255,255,255,.08);
  --green-tint:rgba(87,185,129,.15); --red-tint:rgba(255,106,88,.15);
  --auto-edge:rgba(242,133,61,.4); --auto-bg:rgba(242,133,61,.12); --auto-tx:#f2853d;
  --row-normal:#c7ccd2;
  --radius:9px; --radius-sm:6px; --hero:46px;
  --ui:'Inter',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
  --num:'JetBrains Mono',ui-monospace,'SF Mono','Menlo',monospace;
}

/* ═══════════════════════════════════════
   DESIGN TOKENS — light (theme C)
   ═══════════════════════════════════════ */
.w.light-theme {
  --win-bg:#ffffff; --title-bg:#f5f6f8; --panel-bg:#fbfcfd; --panel2-bg:#eceff3;
  --border:rgba(17,22,29,.14); --hair:rgba(17,22,29,.085); --hair2:rgba(17,22,29,.045);
  --text:#161a20; --muted:#646b76; --faint:#98a0ab;
  --accent:#cc5514; --accent-text:#ffffff; --accent-tint:rgba(204,85,20,.13);
  --green:#1f9d57; --red:#d6412c; --live:#1f9d57; --track:rgba(17,22,29,.08);
  --green-tint:rgba(31,157,87,.14); --red-tint:rgba(214,65,44,.13);
  --auto-edge:rgba(204,85,20,.42); --auto-bg:rgba(204,85,20,.12); --auto-tx:#b34a10;
  --row-normal:#3b414a;
}

@keyframes scaleIn  { from{opacity:0;transform:scale(.985)} to{opacity:1;transform:scale(1)} }
@keyframes overlayIn{ from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
@keyframes numPop   { 0%{transform:scale(1)} 40%{transform:scale(1.06)} 100%{transform:scale(1)} }
@keyframes rowFlash { from{background:var(--accent-tint)} to{background:transparent} }
@keyframes blink    { 0%,100%{opacity:1} 50%{opacity:.3} }

html,body { width:100%;height:100%;overflow:hidden;font-family:var(--ui); }
body      { background:#161412; }
body.light{ background:#e6e8ec; }
#root     { width:100%;height:100%;display:flex;align-items:center;justify-content:center; }

::-webkit-scrollbar { width:9px;height:9px; }
::-webkit-scrollbar-thumb { background:rgba(140,140,150,.35);border-radius:999px; }
::-webkit-scrollbar-track { background:transparent; }

/* ── WINDOW ── */
.w {
  width:min(920px,99vw); height:min(760px,98vh);
  background:var(--win-bg); border:1px solid var(--border); border-radius:var(--radius);
  display:flex; flex-direction:column; overflow:hidden; position:relative;
  color:var(--text); font-family:var(--ui);
  box-shadow:0 34px 90px -34px rgba(0,0,0,.7);
  animation:scaleIn .28s cubic-bezier(.16,1,.3,1);
  user-select:none;
}

/* ── TITLEBAR ── */
.tb {
  display:flex; align-items:center; justify-content:space-between;
  height:34px; flex-shrink:0; padding:0 6px 0 12px;
  background:var(--title-bg); border-bottom:1px solid var(--hair);
  position:relative; z-index:30; cursor:grab; -webkit-app-region:drag;
}
.tb:active { cursor:grabbing; }
.tb-left  { display:flex; align-items:center; gap:12px; }
.tb-brand { font-family:var(--ui); font-weight:700; font-size:11.5px; letter-spacing:.16em; color:var(--accent); }
.tb-div   { width:1px; height:16px; background:var(--hair); }
.tb-sub   { font-family:var(--ui); font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
.tb-right { display:flex; align-items:center; gap:4px; -webkit-app-region:no-drag; }
.tb-live  { display:flex; align-items:center; gap:6px; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-right:8px; }
.tb-dot   { width:6px; height:6px; border-radius:50%; background:var(--live); animation:blink 2s ease-in-out infinite; }
.tb-btn   { width:28px; height:28px; border:none; background:transparent; color:var(--faint); font-size:12px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:var(--radius-sm); transition:background .1s,color .1s; -webkit-app-region:no-drag; }
.tb-btn:hover   { background:var(--panel2-bg); color:var(--text); }
.tb-btn.x:hover { background:var(--red); color:#fff; }

/* ── CONTROLS (top) ── */
.controls { padding:9px 12px; border-bottom:1px solid var(--hair); background:var(--win-bg); display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
.inst-row { display:flex; align-items:center; gap:14px; position:relative; }
.chips    { display:flex; gap:6px; flex-wrap:wrap; flex:1; }
.chip     { display:flex; align-items:center; gap:7px; padding:5px 11px; border:1px solid var(--border); background:var(--panel2-bg); border-radius:999px; cursor:pointer; transition:border-color .12s,background .12s,transform .12s,box-shadow .12s; }
.chip:hover    { border-color:var(--accent); transform:translateY(-1px); }
.chip:active   { transform:translateY(0) scale(.97); }
.chip.on       { background:var(--accent); border-color:var(--accent); box-shadow:0 4px 14px -6px var(--accent); }
.chip-k   { font-family:var(--ui); font-weight:700; font-size:11px; color:var(--text); letter-spacing:.01em; }
.chip.on .chip-k { color:var(--accent-text); }
.chip-r   { font-family:var(--num); font-size:10px; color:var(--muted); padding-left:7px; border-left:1px solid var(--hair); }
.chip.on .chip-r { color:var(--accent-text); border-left-color:rgba(0,0,0,.18); }
.chip-manage { background:transparent; border-style:dashed; color:var(--muted); font-family:var(--ui); font-size:9px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; }
.chip-manage:hover { color:var(--accent); border-color:var(--accent); }

.ctl-grid { display:grid; grid-template-columns:1fr 1fr .72fr; gap:9px; }
.ctl-card { border:1px solid var(--hair); border-radius:var(--radius-sm); background:var(--panel-bg); padding:8px 12px; display:flex; flex-direction:column; gap:5px; transition:border-color .16s,background .16s; }
.ctl-card:focus-within { border-color:var(--accent); background:var(--panel2-bg); }
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.ctl-lbl  { font-family:var(--ui); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600; white-space:nowrap; }
.ctl-hint { font-family:var(--num); font-size:10px; color:var(--faint); white-space:nowrap; }

/* round steppers */
.rbtn { width:34px; height:34px; flex:0 0 34px; border-radius:50%; border:1px solid var(--border); background:var(--panel2-bg); color:var(--text); font-size:19px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:border-color .12s,color .12s,background .12s,transform .1s cubic-bezier(.34,1.56,.64,1); -webkit-user-select:none; user-select:none; }
.rbtn:hover  { border-color:var(--accent); color:var(--accent); }
.rbtn:active { transform:scale(.88); }
.rbtn.lg     { width:34px; height:34px; flex:0 0 34px; font-size:19px; }

.stepper     { display:flex; align-items:center; gap:10px; }
.stepper-val { flex:1; display:flex; align-items:baseline; justify-content:center; gap:5px; min-width:0; }

/* editable numbers */
.num-in { font-family:var(--num); font-weight:800; color:var(--text); background:transparent; border:none; outline:none; text-align:center; padding:0; font-variant-numeric:tabular-nums; field-sizing:content; max-width:150px; -moz-appearance:textfield; caret-color:var(--accent); }
.num-in::-webkit-inner-spin-button, .num-in::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
.num-in::placeholder { color:var(--faint); }
.num-lg { font-size:34px; line-height:1; }
.num-md { font-size:21px; line-height:1; text-align:right; }
.num-pre{ font-family:var(--num); font-size:13px; color:var(--muted); }
.unit   { font-family:var(--ui); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }

.bal-card{ justify-content:space-between; }
.bal-val { display:flex; align-items:baseline; justify-content:flex-end; gap:5px; }

/* Balance in the header (account context) */
.bal-inline { display:flex; align-items:center; gap:10px; border:1px solid var(--hair); border-radius:var(--radius-sm); background:var(--panel-bg); padding:6px 12px; flex-shrink:0; }
.bal-inline .bal-val { justify-content:flex-start; }
.bal-inline .num-in { font-size:18px; text-align:left; }

/* SL + Risk — the sizing engine (left column), stacked */
.engine-grid { display:flex; flex-direction:column; gap:8px; }

/* ── BODY ── */
.body     { flex:1; display:grid; grid-template-columns:286px 10px minmax(0,1fr); gap:0; padding:10px 12px 12px; min-height:0; }
.left-col { display:flex; flex-direction:column; gap:8px; overflow-y:auto; padding-right:2px; }
.resizer  { align-self:stretch; display:flex; align-items:center; justify-content:center; cursor:col-resize; -webkit-app-region:no-drag; }
.resizer::before { content:''; width:2px; height:100%; border-radius:2px; background:transparent; transition:background .12s,width .12s; }
.resizer:hover::before, .resizer.dragging::before { background:var(--accent); width:3px; }

/* Position Size */
.pos-card   { border:1px solid var(--hair); border-radius:var(--radius); background:var(--panel-bg); padding:8px 12px; display:flex; flex-direction:column; align-items:center; gap:5px; }
.pos-stepper{ display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; }
.pos-hero   { font-family:var(--num); font-weight:800; font-size:var(--hero); line-height:.9; color:var(--accent); font-variant-numeric:tabular-nums; }
.pos-hero.pop { animation:numPop .28s cubic-bezier(.34,1.56,.64,1); }
.pos-foot   { display:flex; align-items:center; gap:10px; }
.auto-pill  { font-family:var(--ui); font-size:9px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; padding:3px 9px; border-radius:999px; border:1px solid var(--auto-edge); background:var(--auto-bg); color:var(--auto-tx); cursor:pointer; transition:all .12s; }
.auto-pill.on { background:var(--accent); border-color:var(--accent); color:var(--accent-text); }

/* Risk Check verdict */
.verdict-card{ border:1px solid var(--accent); border-radius:var(--radius); background:var(--panel-bg); padding:8px 12px; display:flex; flex-direction:column; gap:7px; transition:border-color .18s; }
.verdict-pill{ font-family:var(--ui); font-size:9px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; padding:4px 9px; border-radius:999px; color:var(--win-bg); }
.verdict-main{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
.verdict-actual{ display:flex; flex-direction:column; gap:2px; }
.verdict-num { font-family:var(--num); font-weight:800; font-size:22px; line-height:1; font-variant-numeric:tabular-nums; transition:color .18s; }
.verdict-side{ display:flex; flex-direction:column; gap:3px; text-align:right; }
.verdict-target{ font-family:var(--num); font-size:12px; color:var(--muted); }
.verdict-delta { font-family:var(--num); font-size:12px; font-weight:700; }
.util       { display:flex; flex-direction:column; gap:5px; }
.util-head  { display:flex; justify-content:space-between; }
.util-pct   { font-family:var(--num); font-size:11px; font-weight:700; }
.util-track { height:6px; border-radius:999px; background:var(--track); overflow:hidden; }
.util-fill  { height:100%; border-radius:999px; transition:width .28s cubic-bezier(.16,1,.3,1); }

/* 2×2 stats */
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--hair); border:1px solid var(--hair); border-radius:var(--radius-sm); overflow:hidden; }
.stat      { padding:7px 12px; background:var(--win-bg); display:flex; flex-direction:column; gap:3px; }
.stat-l    { font-family:var(--ui); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; }
.stat-v    { font-family:var(--num); font-size:12px; color:var(--text); font-variant-numeric:tabular-nums; }

/* ── LADDER (right) ── */
.right-col   { display:flex; flex-direction:column; min-width:0; min-height:0; border:1px solid var(--hair); border-radius:var(--radius); background:var(--panel-bg); overflow:hidden; }
.ladder-head { display:flex; justify-content:space-between; align-items:center; padding:7px 12px 6px; gap:10px; }
.ladder-title{ font-family:var(--ui); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ladder-legend{ display:flex; align-items:center; gap:12px; font-family:var(--ui); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); flex-shrink:0; }
.lg   { display:flex; align-items:center; gap:5px; }
.dot  { width:7px; height:7px; border-radius:2px; }
.dot.green { background:var(--green); }
.dot.red   { background:var(--red); }
.ladder-cols { display:grid; grid-template-columns:74px 1fr 1fr 1fr; gap:12px; padding:0 12px 5px; border-bottom:1px solid var(--hair); }
.ladder-cols span { font-family:var(--ui); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600; }
.ladder-cols .r { text-align:right; }
.ladder-body { flex:1; overflow-y:auto; min-height:0; scroll-behavior:smooth; }
.lrow { position:relative; display:grid; grid-template-columns:74px 1fr 1fr 1fr; gap:12px; align-items:center; padding:5px 12px; border-bottom:1px solid var(--hair2); cursor:pointer; transition:background .08s; }
.lrow > * { position:relative; z-index:1; }
.lrow:hover { background:var(--panel2-bg); }
.lrow.cur   { background:transparent; border-bottom-color:transparent; }
.lrow.cur::before { content:''; position:absolute; inset:1px 8px; border-radius:var(--radius-sm); background:var(--accent-tint); border:1px solid var(--auto-edge); box-shadow:0 2px 10px -4px var(--accent); z-index:0; pointer-events:none; }
.lrow.flash { animation:rowFlash .35s ease; }
.lcol-pts { display:flex; flex-direction:column; gap:2px; }
.pts      { font-family:var(--num); font-size:12px; font-weight:500; color:var(--text); font-variant-numeric:tabular-nums; }
.lrow.cur .pts { color:var(--accent); font-weight:800; }
.your-stop{ display:inline-block; align-self:flex-start; font-family:var(--ui); font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-text); background:var(--accent); padding:1px 6px; border-radius:999px; margin-top:1px; }
.lval     { font-family:var(--num); font-size:12px; text-align:right; color:var(--row-normal); font-variant-numeric:tabular-nums; }
.lrow.cur .lval:not(.slip) { color:var(--accent); }
.lval.risk { font-weight:500; }
.lrow.cur .lval.risk { font-weight:800; }
.lval.slip { display:flex; justify-content:flex-end; }
.slip-chip { display:inline-block; padding:1px 7px; border-radius:999px; font-family:var(--num); font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; }
.slip-chip.under { color:var(--green); background:var(--green-tint); }
.slip-chip.over  { color:var(--red);   background:var(--red-tint); }
.slip-chip.even  { color:var(--muted); background:var(--track); }

/* ── FOOTER ── */
.footer   { display:flex; align-items:center; justify-content:space-between; height:30px; flex-shrink:0; padding:0 8px 0 14px; background:var(--title-bg); border-top:1px solid var(--hair); font-family:var(--ui); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); position:relative; z-index:20; }
.foot-left{ display:flex; gap:18px; align-items:center; min-width:0; overflow:hidden; }
.foot-left span { white-space:nowrap; }
.foot-right{ display:flex; gap:4px; flex-shrink:0; }
.foot-btn { background:transparent; border:none; font-family:var(--ui); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); cursor:pointer; padding:4px 8px; border-radius:var(--radius-sm); transition:background .1s,color .1s; }
.foot-btn:hover  { background:var(--panel2-bg); color:var(--text); }
.foot-btn.active { color:var(--accent); }

/* ── OVERLAYS ── */
.overlay { position:absolute; z-index:100; background:var(--panel-bg); border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:0 18px 44px rgba(0,0,0,.5); animation:overlayIn .16s cubic-bezier(.16,1,.3,1); }

.manage-ov { top:calc(100% + 8px); left:0; width:320px; max-height:340px; overflow-y:auto; }
.mg-grp  { border-bottom:1px solid var(--hair); padding:5px 0; }
.mg-grp:last-child { border-bottom:none; }
.mg-lbl  { font-family:var(--ui); font-size:9px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); padding:6px 14px 4px; }
.mg-row  { display:flex; align-items:center; gap:10px; padding:6px 14px; }
.mg-bar  { width:2px; height:26px; border-radius:1px; flex-shrink:0; }
.mg-info { flex:1; display:flex; flex-direction:column; gap:1px; }
.mg-k    { font-family:var(--ui); font-size:11px; font-weight:700; color:var(--text); }
.mg-k.fav{ color:var(--accent); }
.mg-n    { font-family:var(--ui); font-size:9px; color:var(--muted); }
.mg-pv   { font-family:var(--num); font-size:10px; color:var(--muted); font-weight:600; }
.mg-star { width:26px; height:26px; border:1px solid var(--border); background:transparent; border-radius:var(--radius-sm); color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; transition:all .12s; }
.mg-star:hover { border-color:var(--accent); color:var(--accent); }
.mg-star.on    { border-color:var(--accent); color:var(--accent); background:var(--accent-tint); }

.settings-ov { bottom:calc(100% + 8px); right:0; width:244px; }
.st-sec  { border-bottom:1px solid var(--hair); padding:10px 14px; }
.st-sec:last-child { border-bottom:none; }
.st-head { font-family:var(--ui); font-size:9px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.st-row  { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
.st-row:last-child { margin-bottom:0; }
.st-lbl  { font-family:var(--ui); font-size:11px; color:var(--text); text-transform:none; letter-spacing:0; }
.st-foot { font-family:var(--ui); font-size:9px; color:var(--faint); text-align:center; letter-spacing:.04em; }

/* About / credits */
.ab-row  { display:flex; align-items:center; gap:11px; }
.ab-icon { width:36px; height:36px; border-radius:9px; flex-shrink:0; }
.ab-name { font-family:var(--ui); font-size:13px; font-weight:700; color:var(--text); }
.ab-ver  { font-family:var(--num); font-size:10px; color:var(--muted); margin-top:2px; }
.ab-tag  { font-family:var(--ui); font-size:11px; color:var(--muted); line-height:1.5; margin-top:9px; }
.ab-meta { font-family:var(--ui); font-size:10px; color:var(--faint); line-height:1.7; margin-top:9px; }
.ab-link { color:var(--accent); cursor:pointer; }
.ab-link:hover { text-decoration:underline; }

/* toggle */
.tog { position:relative; width:30px; height:16px; flex-shrink:0; }
.tog input { opacity:0; width:0; height:0; position:absolute; }
.tog-t { position:absolute; inset:0; border:1px solid var(--border); background:var(--panel2-bg); border-radius:999px; cursor:pointer; transition:background .14s,border-color .14s; }
.tog input:checked + .tog-t { background:var(--accent); border-color:var(--accent); }
.tog-t::after { content:''; position:absolute; top:2px; left:2px; width:10px; height:10px; border-radius:50%; background:var(--muted); transition:transform .14s,background .14s; }
.tog input:checked + .tog-t::after { transform:translateX(14px); background:var(--accent-text); }

/* segmented theme control */
.seg { display:flex; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; }
.seg-btn { flex:1; padding:5px 0; border:none; border-right:1px solid var(--border); background:var(--panel2-bg); font-family:var(--ui); font-size:9px; font-weight:700; letter-spacing:.1em; color:var(--muted); cursor:pointer; transition:background .12s,color .12s; }
.seg-btn:last-child { border-right:none; }
.seg-btn.on { background:var(--accent); color:var(--accent-text); }
.seg-btn:not(.on):hover { color:var(--text); }

/* ── Accessibility & reduced motion ── */
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
.num-in:focus-visible { outline:none; }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
}

/* ═══════════════════════════════════════
   ELECTRON — fill full native window
   ═══════════════════════════════════════ */
html.electron-app #root { align-items:stretch; justify-content:stretch; }
html.electron-app .w {
  width:100% !important; height:100% !important;
  border:none !important; border-radius:0 !important;
  box-shadow:none !important; animation:none !important;
}
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
