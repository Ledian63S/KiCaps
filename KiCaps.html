<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KiCaps — Position Calculator</title>
<link rel="icon" type="image/png" href="icon.png">
<script src="lib/react.min.js"></script>
<script src="lib/react-dom.min.js"></script>
<script src="lib/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

/* ═══════════════════════════════════════
   DESIGN TOKENS — dark (theme A)
   ═══════════════════════════════════════ */
:root {
  --win-bg:#0b0c0e; --title-bg:#101214; --panel-bg:#0e1013; --panel2-bg:#15181c;
  --border:rgba(255,255,255,.10); --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.04);
  --text:#f1f3f5; --muted:#797f88; --faint:#565b63;
  --accent:#f2853d; --accent-text:#1a1206; --accent-tint:rgba(242,133,61,.16);
  --green:#57b981; --red:#ff6a58; --live:#57b981; --track:rgba(255,255,255,.08);
  --auto-edge:rgba(242,133,61,.4); --auto-bg:rgba(242,133,61,.12); --auto-tx:#f2853d;
  --row-normal:#c7ccd2;
  --radius:9px; --radius-sm:6px; --hero:46px;
  --ui:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --num:'JetBrains Mono','Cascadia Code',monospace;
}

/* ═══════════════════════════════════════
   DESIGN TOKENS — light (theme C)
   ═══════════════════════════════════════ */
.w.light-theme {
  --win-bg:#ffffff; --title-bg:#f4efe7; --panel-bg:#faf7f1; --panel2-bg:#f0ebe2;
  --border:rgba(30,20,10,.14); --hair:rgba(30,20,10,.09); --hair2:rgba(30,20,10,.05);
  --text:#1c1712; --muted:#8a7f70; --faint:#a89c8c;
  --accent:#c25a12; --accent-text:#ffffff; --accent-tint:rgba(194,90,18,.12);
  --green:#2f8f5a; --red:#c9452f; --live:#2f8f5a; --track:rgba(30,20,10,.08);
  --auto-edge:rgba(194,90,18,.35); --auto-bg:rgba(194,90,18,.10); --auto-tx:#c25a12;
  --row-normal:#4a4238;
}

@keyframes scaleIn  { from{opacity:0;transform:scale(.985)} to{opacity:1;transform:scale(1)} }
@keyframes overlayIn{ from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
@keyframes numPop   { 0%{transform:scale(1)} 40%{transform:scale(1.06)} 100%{transform:scale(1)} }
@keyframes rowFlash { from{background:var(--accent-tint)} to{background:transparent} }
@keyframes blink    { 0%,100%{opacity:1} 50%{opacity:.3} }

html,body { width:100%;height:100%;overflow:hidden;font-family:var(--ui); }
body      { background:#161412; }
body.light{ background:#e8e2d8; }
#root     { width:100%;height:100%;display:flex;align-items:center;justify-content:center; }

::-webkit-scrollbar { width:9px;height:9px; }
::-webkit-scrollbar-thumb { background:rgba(140,140,150,.35);border-radius:999px; }
::-webkit-scrollbar-track { background:transparent; }

/* ── WINDOW ── */
.w {
  width:min(920px,99vw); height:min(760px,98vh);
  background:var(--win-bg); border:1px solid var(--border); border-radius:var(--radius);
  display:flex; flex-direction:column; overflow:hidden; position:relative;
  color:var(--text); font-family:var(--ui);
  box-shadow:0 34px 90px -34px rgba(0,0,0,.7);
  animation:scaleIn .28s cubic-bezier(.16,1,.3,1);
  user-select:none;
}

/* ── TITLEBAR ── */
.tb {
  display:flex; align-items:center; justify-content:space-between;
  height:34px; flex-shrink:0; padding:0 6px 0 12px;
  background:var(--title-bg); border-bottom:1px solid var(--hair);
  position:relative; z-index:30; cursor:grab; -webkit-app-region:drag;
}
.tb:active { cursor:grabbing; }
.tb-left  { display:flex; align-items:center; gap:12px; }
.tb-brand { font-family:var(--ui); font-weight:700; font-size:11.5px; letter-spacing:.16em; color:var(--accent); }
.tb-div   { width:1px; height:16px; background:var(--hair); }
.tb-sub   { font-family:var(--ui); font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
.tb-right { display:flex; align-items:center; gap:4px; -webkit-app-region:no-drag; }
.tb-live  { display:flex; align-items:center; gap:6px; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-right:8px; }
.tb-dot   { width:6px; height:6px; border-radius:50%; background:var(--live); animation:blink 2s ease-in-out infinite; }
.tb-btn   { width:28px; height:28px; border:none; background:transparent; color:var(--faint); font-size:12px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:var(--radius-sm); transition:background .1s,color .1s; -webkit-app-region:no-drag; }
.tb-btn:hover   { background:var(--panel2-bg); color:var(--text); }
.tb-btn.x:hover { background:var(--red); color:#fff; }

/* ── CONTROLS (top) ── */
.controls { padding:9px 13px; border-bottom:1px solid var(--hair); background:var(--win-bg); display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
.inst-row { display:flex; align-items:center; gap:14px; position:relative; }
.chips    { display:flex; gap:6px; flex-wrap:wrap; flex:1; }
.chip     { display:flex; align-items:center; gap:6px; padding:4px 9px; border:1px solid var(--border); background:var(--panel2-bg); border-radius:999px; cursor:pointer; transition:border-color .12s,background .12s; }
.chip:hover    { border-color:var(--accent); }
.chip.on       { background:var(--accent); border-color:var(--accent); }
.chip-k   { font-family:var(--num); font-weight:700; font-size:11px; color:var(--text); }
.chip.on .chip-k { color:var(--accent-text); }
.chip-r   { font-family:var(--num); font-size:10px; color:var(--muted); }
.chip.on .chip-r { color:var(--accent-text); }
.chip-manage { background:transparent; border-style:dashed; color:var(--muted); font-family:var(--ui); font-size:9px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; }
.chip-manage:hover { color:var(--accent); border-color:var(--accent); }

.ctl-grid { display:grid; grid-template-columns:1fr 1fr .72fr; gap:9px; }
.ctl-card { border:1px solid var(--hair); border-radius:var(--radius-sm); background:var(--panel-bg); padding:7px 11px; display:flex; flex-direction:column; gap:5px; }
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.ctl-lbl  { font-family:var(--ui); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600; white-space:nowrap; }
.ctl-hint { font-family:var(--num); font-size:10px; color:var(--faint); white-space:nowrap; }

/* round steppers */
.rbtn { width:30px; height:30px; flex:0 0 30px; border-radius:50%; border:1px solid var(--border); background:var(--panel2-bg); color:var(--text); font-size:17px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:border-color .12s,color .12s,background .12s; }
.rbtn:hover  { border-color:var(--accent); color:var(--accent); }
.rbtn.lg     { width:34px; height:34px; flex:0 0 34px; font-size:19px; }

.stepper     { display:flex; align-items:center; gap:10px; }
.stepper-val { flex:1; display:flex; align-items:baseline; justify-content:center; gap:5px; min-width:0; }

/* editable numbers */
.num-in { font-family:var(--num); font-weight:800; color:var(--text); background:transparent; border:none; outline:none; text-align:center; padding:0; font-variant-numeric:tabular-nums; field-sizing:content; max-width:150px; -moz-appearance:textfield; caret-color:var(--accent); }
.num-in::-webkit-inner-spin-button, .num-in::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
.num-in::placeholder { color:var(--faint); }
.num-lg { font-size:24px; line-height:1; }
.num-md { font-size:21px; line-height:1; text-align:right; }
.num-pre{ font-family:var(--num); font-size:13px; color:var(--muted); }
.unit   { font-family:var(--ui); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }

.bal-card{ justify-content:space-between; }
.bal-val { display:flex; align-items:baseline; justify-content:flex-end; gap:5px; }

/* ── BODY ── */
.body     { flex:1; display:grid; grid-template-columns:360px minmax(0,1fr); min-height:0; }
.left-col { padding:10px; display:flex; flex-direction:column; gap:8px; border-right:1px solid var(--hair); overflow-y:auto; }

/* Position Size */
.pos-card   { border:1px solid var(--hair); border-radius:var(--radius); background:var(--panel-bg); padding:9px 13px; display:flex; flex-direction:column; align-items:center; gap:5px; }
.pos-stepper{ display:flex; align-items:center; gap:16px; }
.pos-hero   { font-family:var(--num); font-weight:800; font-size:var(--hero); line-height:.9; color:var(--accent); font-variant-numeric:tabular-nums; }
.pos-hero.pop { animation:numPop .28s cubic-bezier(.34,1.56,.64,1); }
.pos-foot   { display:flex; align-items:center; gap:10px; }
.auto-pill  { font-family:var(--ui); font-size:9px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; padding:3px 9px; border-radius:999px; border:1px solid var(--auto-edge); background:var(--auto-bg); color:var(--auto-tx); cursor:pointer; transition:all .12s; }
.auto-pill.on { background:var(--accent); border-color:var(--accent); color:var(--accent-text); }

/* Risk Check verdict */
.verdict-card{ border:1px solid var(--accent); border-radius:var(--radius); background:var(--panel-bg); padding:9px 12px; display:flex; flex-direction:column; gap:7px; transition:border-color .18s; }
.verdict-pill{ font-family:var(--ui); font-size:9px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; padding:4px 9px; border-radius:999px; color:var(--win-bg); }
.verdict-main{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
.verdict-actual{ display:flex; flex-direction:column; gap:2px; }
.verdict-num { font-family:var(--num); font-weight:800; font-size:22px; line-height:1; font-variant-numeric:tabular-nums; transition:color .18s; }
.verdict-side{ display:flex; flex-direction:column; gap:3px; text-align:right; }
.verdict-target{ font-family:var(--num); font-size:12px; color:var(--muted); }
.verdict-delta { font-family:var(--num); font-size:12px; font-weight:700; }
.util       { display:flex; flex-direction:column; gap:5px; }
.util-head  { display:flex; justify-content:space-between; }
.util-pct   { font-family:var(--num); font-size:11px; font-weight:700; }
.util-track { height:6px; border-radius:999px; background:var(--track); overflow:hidden; }
.util-fill  { height:100%; border-radius:999px; transition:width .28s cubic-bezier(.16,1,.3,1); }

/* 2×2 stats */
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--hair); border:1px solid var(--hair); border-radius:var(--radius-sm); overflow:hidden; }
.stat      { padding:6px 10px; background:var(--win-bg); display:flex; flex-direction:column; gap:3px; }
.stat-l    { font-family:var(--ui); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; }
.stat-v    { font-family:var(--num); font-size:12px; color:var(--text); font-variant-numeric:tabular-nums; }

/* ── LADDER (right) ── */
.right-col   { display:flex; flex-direction:column; min-width:0; min-height:0; }
.ladder-head { display:flex; justify-content:space-between; align-items:center; padding:7px 14px 6px; gap:10px; }
.ladder-title{ font-family:var(--ui); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ladder-legend{ display:flex; align-items:center; gap:12px; font-family:var(--ui); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); flex-shrink:0; }
.lg   { display:flex; align-items:center; gap:5px; }
.dot  { width:7px; height:7px; border-radius:2px; }
.dot.green { background:var(--green); }
.dot.red   { background:var(--red); }
.ladder-cols { display:grid; grid-template-columns:74px 1fr 1fr 1fr; gap:12px; padding:0 14px 5px; border-bottom:1px solid var(--hair); }
.ladder-cols span { font-family:var(--ui); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600; }
.ladder-cols .r { text-align:right; }
.ladder-body { flex:1; overflow-y:auto; min-height:0; }
.lrow { display:grid; grid-template-columns:74px 1fr 1fr 1fr; gap:12px; align-items:center; padding:5px 14px 5px 12px; border-bottom:1px solid var(--hair2); border-left:2px solid transparent; cursor:pointer; transition:background .08s; }
.lrow:hover { background:var(--panel2-bg); }
.lrow.cur   { background:var(--accent-tint); border-left-color:var(--accent); }
.lrow.flash { animation:rowFlash .35s ease; }
.lcol-pts { display:flex; flex-direction:column; gap:2px; }
.pts      { font-family:var(--num); font-size:11px; font-weight:500; color:var(--text); font-variant-numeric:tabular-nums; }
.lrow.cur .pts { color:var(--accent); font-weight:800; }
.your-stop{ font-family:var(--ui); font-size:8px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }
.lval     { font-family:var(--num); font-size:11px; text-align:right; color:var(--row-normal); font-variant-numeric:tabular-nums; }
.lrow.cur .lval:not(.slip) { color:var(--accent); }
.lval.risk { font-weight:500; }
.lrow.cur .lval.risk { font-weight:800; }

/* ── FOOTER ── */
.footer   { display:flex; align-items:center; justify-content:space-between; height:30px; flex-shrink:0; padding:0 8px 0 14px; background:var(--title-bg); border-top:1px solid var(--hair); font-family:var(--ui); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); position:relative; z-index:20; }
.foot-left{ display:flex; gap:18px; align-items:center; min-width:0; overflow:hidden; }
.foot-left span { white-space:nowrap; }
.foot-right{ display:flex; gap:4px; flex-shrink:0; }
.foot-btn { background:transparent; border:none; font-family:var(--ui); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); cursor:pointer; padding:4px 8px; border-radius:var(--radius-sm); transition:background .1s,color .1s; }
.foot-btn:hover  { background:var(--panel2-bg); color:var(--text); }
.foot-btn.active { color:var(--accent); }

/* ── OVERLAYS ── */
.overlay { position:absolute; z-index:100; background:var(--panel-bg); border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:0 18px 44px rgba(0,0,0,.5); animation:overlayIn .16s cubic-bezier(.16,1,.3,1); }

.manage-ov { top:calc(100% + 8px); left:0; width:320px; max-height:340px; overflow-y:auto; }
.mg-grp  { border-bottom:1px solid var(--hair); padding:5px 0; }
.mg-grp:last-child { border-bottom:none; }
.mg-lbl  { font-family:var(--ui); font-size:8px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); padding:6px 14px 4px; }
.mg-row  { display:flex; align-items:center; gap:10px; padding:6px 14px; }
.mg-bar  { width:2px; height:26px; border-radius:1px; flex-shrink:0; }
.mg-info { flex:1; display:flex; flex-direction:column; gap:1px; }
.mg-k    { font-family:var(--num); font-size:11px; font-weight:700; color:var(--text); }
.mg-k.fav{ color:var(--accent); }
.mg-n    { font-family:var(--ui); font-size:9px; color:var(--muted); }
.mg-pv   { font-family:var(--num); font-size:10px; color:var(--muted); font-weight:600; }
.mg-star { width:26px; height:26px; border:1px solid var(--border); background:transparent; border-radius:var(--radius-sm); color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; transition:all .12s; }
.mg-star:hover { border-color:var(--accent); color:var(--accent); }
.mg-star.on    { border-color:var(--accent); color:var(--accent); background:var(--accent-tint); }

.settings-ov { bottom:calc(100% + 8px); right:0; width:244px; }
.st-sec  { border-bottom:1px solid var(--hair); padding:10px 14px; }
.st-sec:last-child { border-bottom:none; }
.st-head { font-family:var(--ui); font-size:8px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.st-row  { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
.st-row:last-child { margin-bottom:0; }
.st-lbl  { font-family:var(--ui); font-size:11px; color:var(--text); text-transform:none; letter-spacing:0; }
.st-foot { font-family:var(--ui); font-size:9px; color:var(--faint); text-align:center; letter-spacing:.04em; }

/* toggle */
.tog { position:relative; width:30px; height:16px; flex-shrink:0; }
.tog input { opacity:0; width:0; height:0; position:absolute; }
.tog-t { position:absolute; inset:0; border:1px solid var(--border); background:var(--panel2-bg); border-radius:999px; cursor:pointer; transition:background .14s,border-color .14s; }
.tog input:checked + .tog-t { background:var(--accent); border-color:var(--accent); }
.tog-t::after { content:''; position:absolute; top:2px; left:2px; width:10px; height:10px; border-radius:50%; background:var(--muted); transition:transform .14s,background .14s; }
.tog input:checked + .tog-t::after { transform:translateX(14px); background:var(--accent-text); }

/* segmented theme control */
.seg { display:flex; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; }
.seg-btn { flex:1; padding:5px 0; border:none; border-right:1px solid var(--border); background:var(--panel2-bg); font-family:var(--ui); font-size:8px; font-weight:700; letter-spacing:.1em; color:var(--muted); cursor:pointer; transition:background .12s,color .12s; }
.seg-btn:last-child { border-right:none; }
.seg-btn.on { background:var(--accent); color:var(--accent-text); }
.seg-btn:not(.on):hover { color:var(--text); }

/* ═══════════════════════════════════════
   ELECTRON — fill full native window
   ═══════════════════════════════════════ */
html.electron-app #root { align-items:stretch; justify-content:stretch; }
html.electron-app .w {
  width:100% !important; height:100% !important;
  border:none !important; border-radius:0 !important;
  box-shadow:none !important; animation:none !important;
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const GROUPS = [
  { label:'Full Size', keys:['ES','NQ','GC','6E','6B'] },
  { label:'Micro',     keys:['MES','MNQ','MGC'] },
];
const ALL_INSTR = {
  ES:   { name:'E-mini S&P 500',   pv:50,   step:2    },
  NQ:   { name:'E-mini Nasdaq',    pv:20,   step:2    },
  GC:   { name:'Gold Futures',     pv:10,   step:1    },
  '6E': { name:'Euro FX',          pv:12.5, step:1    },
  '6B': { name:'British Pound',    pv:6.25, step:1    },
  MES:  { name:'Micro S&P',        pv:5,    step:0.25 },
  MNQ:  { name:'Micro Nasdaq',     pv:2,    step:0.25 },
  MGC:  { name:'Micro Gold',       pv:1,    step:0.25 },
};

const LS = {
  get:(k,d)=>{ try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch{return d;} },
  set:(k,v)=>{ try{localStorage.setItem(k,JSON.stringify(v));}catch{} },
};
const f$   = n=>(n==null||isNaN(n))?'—':'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fPts = n=>n%1===0?String(n):n.toFixed(2);

/* slippage / delta → { txt, color } (green under budget, red over) */
function slipInfo(s){
  if(Math.abs(s)<0.005) return { txt:'—', color:'var(--muted)' };
  if(s<0)               return { txt:f$(s), color:'var(--green)' };
  return                       { txt:'+'+f$(s), color:'var(--red)' };
}

function Toggle({checked,onChange}){
  return(
    <label className="tog">
      <input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)}/>
      <div className="tog-t"></div>
    </label>
  );
}

function App(){
  /* settings */
  const [remBal,    setRemBal]    = useState(()=>LS.get('q6-rembal',   true));
  const [remRisk,   setRemRisk]   = useState(()=>LS.get('q6-remrisk',  true));
  const [remInstr,  setRemInstr]  = useState(()=>LS.get('q6-reminstr', true));
  const [themeMode, setThemeMode] = useState(()=>LS.get('q6-theme',    'dark'));

  /* calc state */
  const [instr,    setInstrRaw] = useState(()=>LS.get('q6-instr',  'MNQ'));
  const [balance,  setBalance]  = useState(()=>String(LS.get('q6-bal',  50000)));
  const [riskMode, setRiskMode] = useState(()=>LS.get('q6-rm',     'fixed'));
  const [riskVal,  setRiskVal]  = useState(()=>String(LS.get('q6-rv',   200)));
  const [slPts,    setSlPts]    = useState(()=>String(LS.get('q6-sl',   25)));
  const [override, setOverride] = useState(null);
  const [favs,     setFavs]     = useState(()=>LS.get('q6-favs',   ['MNQ','MES','NQ','ES']));

  /* ui */
  const [showManage,   setShowManage]   = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [flashRow,     setFlashRow]     = useState(null);
  const [minimized,    setMinimized]    = useState(false);
  const [closed,       setClosed]       = useState(false);
  const heroRef  = useRef(null);
  const tableRef = useRef(null);
  const prevC    = useRef(null);

  /* window drag (browser only — Electron handles native drag) */
  const winRef   = useRef(null);
  const dragRef  = useRef(null);
  const [winPos, setWinPos] = useState(null);

  useEffect(()=>{
    function onMove(e){
      if(!dragRef.current) return;
      const {ox,oy}=dragRef.current;
      setWinPos({x:e.clientX-ox, y:e.clientY-oy});
    }
    function onUp(){ dragRef.current=null; document.body.style.userSelect=''; }
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    return()=>{ window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); };
  },[]);

  function onTbDown(e){
    if(window.electronAPI) return;                       /* native drag in app */
    if(e.target.closest('.tb-btn')||e.target.closest('[data-ot]')) return;
    e.preventDefault();
    document.body.style.userSelect='none';
    const rect=winRef.current.getBoundingClientRect();
    if(!winPos) setWinPos({x:rect.left,y:rect.top});
    dragRef.current={ox:e.clientX-rect.left, oy:e.clientY-rect.top};
  }

  /* system dark mode */
  const [sysDark, setSysDark] = useState(()=>window.matchMedia('(prefers-color-scheme:dark)').matches);
  useEffect(()=>{
    const mq=window.matchMedia('(prefers-color-scheme:dark)');
    const h=e=>setSysDark(e.matches);
    mq.addEventListener('change',h);
    return ()=>mq.removeEventListener('change',h);
  },[]);
  const isDark = themeMode==='dark'||(themeMode==='system'&&sysDark);
  const isLight = !isDark;

  useEffect(()=>{ document.body.className=isDark?'':'light'; },[isDark]);

  /* persist */
  useEffect(()=>{ LS.set('q6-theme',   themeMode); },[themeMode]);
  useEffect(()=>{ LS.set('q6-rembal',  remBal);    },[remBal]);
  useEffect(()=>{ LS.set('q6-remrisk', remRisk);   },[remRisk]);
  useEffect(()=>{ LS.set('q6-reminstr',remInstr);  },[remInstr]);
  useEffect(()=>{ LS.set('q6-favs',    favs);       },[favs]);
  useEffect(()=>{ if(remInstr) LS.set('q6-instr', instr); },[instr,remInstr]);
  useEffect(()=>{ if(remBal)   LS.set('q6-bal',   parseFloat(balance)||0); },[balance,remBal]);
  useEffect(()=>{ if(remRisk){ LS.set('q6-rv', parseFloat(riskVal)||0); LS.set('q6-rm',riskMode); } },[riskVal,riskMode,remRisk]);
  useEffect(()=>{ LS.set('q6-sl', parseFloat(slPts)||0); },[slPts]);
  useEffect(()=>{ setOverride(null); },[balance,riskMode,riskVal,slPts,instr]);

  const setInstr = useCallback((t)=>{
    setInstrRaw(t);
    if(!favs.includes(t)) setFavs(f=>[...f,t]);
  },[favs]);

  const toggleFav = useCallback((t)=>{
    setFavs(f=>{
      if(f.includes(t)){
        if(f.length===1) return f;
        const next=f.filter(x=>x!==t);
        if(t===instr) setInstrRaw(next[0]);
        return next;
      }
      return [...f,t];
    });
  },[instr]);

  /* close overlays on outside click */
  useEffect(()=>{
    if(!showManage&&!showSettings) return;
    const h=e=>{ if(!e.target.closest('.overlay')&&!e.target.closest('[data-ot]')){ setShowManage(false); setShowSettings(false); } };
    document.addEventListener('mousedown',h);
    return ()=>document.removeEventListener('mousedown',h);
  },[showManage,showSettings]);

  /* calculations */
  const pv      = ALL_INSTR[instr].pv;
  const ptStep  = ALL_INSTR[instr].step;
  const balNum  = parseFloat(balance)  || 0;
  const rvNum   = parseFloat(riskVal)  || 0;
  const slNum   = parseFloat(slPts)    || 0;
  const riskDol = riskMode==='percent' ? balNum*rvNum/100 : rvNum;
  const riskPct = balNum>0 ? riskDol/balNum*100 : 0;
  const slDol   = slNum*pv;
  const autoC   = slDol>0 ? Math.max(0,Math.round(riskDol/slDol)) : 0;
  const contracts=override!==null ? override : autoC;
  const actRisk  = contracts*slDol;
  const delta    = actRisk-riskDol;                       /* slippage vs target */
  const util     = riskDol>0 ? actRisk/riskDol*100 : 0;

  /* verdict */
  let verdictLabel, verdictColor, deltaStr;
  if(Math.abs(delta)<0.005){ verdictLabel='On Target';   verdictColor='var(--accent)'; deltaStr='±$0.00'; }
  else if(delta<0){          verdictLabel='Under Target'; verdictColor='var(--green)';  deltaStr='−'+f$(delta); }
  else {                     verdictLabel='Over Limit';   verdictColor='var(--red)';    deltaStr='+'+f$(delta); }

  /* ladder rows — centered around slNum so it's always visible */
  const rows=[];
  const halfWin=28;
  if(slNum>0){
    const ci=Math.round(slNum/ptStep);
    const si=Math.max(1,ci-halfWin);
    const ei=ci+halfWin;
    for(let i=si;i<=ei;i++){
      const p=+(i*ptStep).toFixed(6);
      const d=+(p*pv).toFixed(4);
      const c=Math.max(0,Math.round(riskDol/d));
      const ar=+(c*d).toFixed(4);
      rows.push({p,d,c,ar,slip:+(ar-riskDol).toFixed(4)});
    }
  } else {
    for(let p=ptStep;rows.length<60;p=+(p+ptStep).toFixed(6)){
      const d=+(p*pv).toFixed(4);
      const c=Math.max(0,Math.round(riskDol/d));
      const ar=+(c*d).toFixed(4);
      rows.push({p,d,c,ar,slip:+(ar-riskDol).toFixed(4)});
    }
  }

  /* hero pop */
  useEffect(()=>{
    if(prevC.current!==null&&prevC.current!==contracts&&heroRef.current){
      heroRef.current.classList.remove('pop');
      void heroRef.current.offsetWidth;
      heroRef.current.classList.add('pop');
    }
    prevC.current=contracts;
  },[contracts]);

  /* auto-scroll selected row to center */
  const firstScroll = useRef(true);
  useEffect(()=>{
    if(!tableRef.current) return;
    const cur=tableRef.current.querySelector('.lrow.cur');
    if(cur){
      cur.scrollIntoView({block:'center',behavior:firstScroll.current?'instant':'smooth'});
      firstScroll.current=false;
    }
  },[slNum,instr]);

  const handleRowClick=(p)=>{
    setSlPts(String(p));
    setFlashRow(p);
    setTimeout(()=>setFlashRow(null),350);
  };

  /* steppers */
  const stepSL = (dir)=> setSlPts(prev=>{
    const v=Math.max(ptStep, Math.round(((parseFloat(prev)||0)+dir*ptStep)/ptStep)*ptStep);
    return String(+v.toFixed(4));
  });
  const riskStep = riskMode==='percent'?0.1:25;
  const stepRisk = (dir)=> setRiskVal(prev=>{
    const v=Math.max(riskStep, (parseFloat(prev)||0)+dir*riskStep);
    return String(+v.toFixed(2));
  });

  const favInstr = favs.filter(t=>ALL_INSTR[t]);
  const instName = ALL_INSTR[instr].name;

  /* hints */
  const slHint   = slDol>0 ? `${f$(slDol)} · $${pv}/pt` : `$${pv}/pt`;
  const riskHint = riskMode==='fixed'
    ? (balNum>0 ? `${riskPct.toFixed(2)}% of balance` : 'USD')
    : (riskDol>0 ? `${f$(riskDol)}` : 'PCT');

  const deltaSlip = slipInfo(delta);

  if(closed) return null;

  const winStyle = winPos
    ? {position:'fixed',left:winPos.x,top:winPos.y,transform:'none',margin:0,animation:'none'}
    : {};

  return(
    <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div ref={winRef} className={`w${isLight?' light-theme':''}`}
        style={{...winStyle,...(minimized?{height:'46px'}:{})}}>

        {/* ── TITLEBAR ── */}
        <div className="tb" onMouseDown={onTbDown}>
          <div className="tb-left" style={{cursor:'default'}}>
            <span className="tb-brand">KICAPS</span>
            <span className="tb-div"></span>
            <span className="tb-sub">Position Calculator</span>
          </div>
          <div className="tb-right">
            <span className="tb-live"><span className="tb-dot"></span>Live</span>
            <button className="tb-btn" title="Minimize"
              onClick={()=>window.electronAPI ? window.electronAPI.minimize() : setMinimized(v=>!v)}>—</button>
            <button className="tb-btn" title="Maximize"
              onClick={()=>window.electronAPI ? window.electronAPI.maximize() : (setWinPos(null),setMinimized(false))}>▢</button>
            <button className="tb-btn x" title="Close"
              onClick={()=>window.electronAPI ? window.electronAPI.close() : setClosed(true)}>✕</button>
          </div>
        </div>

        {/* ── CONTROLS ── */}
        <div className="controls">

          {/* instrument chips */}
          <div className="inst-row">
            <span className="ctl-lbl">Instrument</span>
            <div className="chips">
              {favInstr.map(k=>(
                <button key={k} className={`chip${instr===k?' on':''}`} onClick={()=>setInstr(k)}>
                  <span className="chip-k">{k}</span>
                  <span className="chip-r">${ALL_INSTR[k].pv}/pt</span>
                </button>
              ))}
              <button className="chip chip-manage" data-ot="1"
                onClick={()=>{ setShowManage(v=>!v); setShowSettings(false); }}>
                {showManage?'close':'manage ☆'}
              </button>
            </div>

            {/* manage overlay */}
            {showManage && (
              <div className="overlay manage-ov">
                {GROUPS.map(g=>(
                  <div key={g.label} className="mg-grp">
                    <div className="mg-lbl">{g.label}</div>
                    {g.keys.map(k=>(
                      <div key={k} className="mg-row">
                        <div className="mg-bar" style={{background:favs.includes(k)?'var(--accent)':'var(--hair)'}}></div>
                        <div className="mg-info">
                          <span className={`mg-k${favs.includes(k)?' fav':''}`}>{k}</span>
                          <span className="mg-n">{ALL_INSTR[k].name}</span>
                        </div>
                        <span className="mg-pv">${ALL_INSTR[k].pv}/pt</span>
                        <button className={`mg-star${favs.includes(k)?' on':''}`}
                          onClick={()=>toggleFav(k)}
                          title={favs.includes(k)?'Remove':'Add to watchlist'}>
                          {favs.includes(k)?'★':'☆'}
                        </button>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* SL / Risk / Balance */}
          <div className="ctl-grid">

            {/* Stop Loss */}
            <div className="ctl-card">
              <div className="card-head">
                <span className="ctl-lbl">Stop Loss</span>
                <span className="ctl-hint">{slHint}</span>
              </div>
              <div className="stepper">
                <button className="rbtn" onClick={()=>stepSL(-1)}>−</button>
                <div className="stepper-val">
                  <input className="num-in num-lg" type="number" value={slPts} autoFocus
                    step={ptStep} placeholder="0" onChange={e=>setSlPts(e.target.value)}/>
                  <span className="unit">pts</span>
                </div>
                <button className="rbtn" onClick={()=>stepSL(1)}>+</button>
              </div>
            </div>

            {/* Risk / Trade */}
            <div className="ctl-card">
              <div className="card-head">
                <span className="ctl-lbl">Risk / Trade</span>
                <span className="ctl-hint">{riskHint}</span>
              </div>
              <div className="stepper">
                <button className="rbtn" onClick={()=>stepRisk(-1)}>−</button>
                <div className="stepper-val">
                  <span className="num-pre">{riskMode==='fixed'?'$':'%'}</span>
                  <input className="num-in num-lg" type="number" value={riskVal}
                    step={riskStep} placeholder="0" onChange={e=>setRiskVal(e.target.value)}/>
                </div>
                <button className="rbtn" onClick={()=>stepRisk(1)}>+</button>
              </div>
            </div>

            {/* Balance */}
            <div className="ctl-card bal-card">
              <span className="ctl-lbl">Balance</span>
              <div className="bal-val">
                <span className="num-pre">$</span>
                <input className="num-in num-md" type="text" inputMode="numeric" placeholder="0"
                  value={balance===''?'':(parseFloat(balance)||0).toLocaleString('en-US')}
                  onChange={e=>setBalance(e.target.value.replace(/[^0-9.]/g,''))}/>
              </div>
            </div>
          </div>
        </div>

        {/* ── BODY ── */}
        <div className="body">

          {/* LEFT */}
          <div className="left-col">

            {/* Position Size */}
            <div className="pos-card">
              <div className="ctl-lbl">Position Size</div>
              <div className="pos-stepper">
                <button className="rbtn lg" onClick={()=>setOverride(c=>Math.max(0,(c??autoC)-1))}>−</button>
                <span ref={heroRef} className="pos-hero">{contracts}</span>
                <button className="rbtn lg" onClick={()=>setOverride(c=>Math.max(0,(c??autoC)+1))}>+</button>
              </div>
              <div className="pos-foot">
                <span className="ctl-lbl">Contracts</span>
                <button className={`auto-pill${override===null?' on':''}`} onClick={()=>setOverride(null)}>Auto</button>
              </div>
            </div>

            {/* Risk Check */}
            <div className="verdict-card" style={{borderColor:verdictColor}}>
              <div className="card-head">
                <span className="ctl-lbl">Risk Check</span>
                <span className="verdict-pill" style={{background:verdictColor}}>{verdictLabel}</span>
              </div>
              <div className="verdict-main">
                <div className="verdict-actual">
                  <span className="ctl-lbl">Actual Risk</span>
                  <span className="verdict-num" style={{color:verdictColor}}>{f$(actRisk)}</span>
                </div>
                <div className="verdict-side">
                  <span className="verdict-target">Target {f$(riskDol)}</span>
                  <span className="verdict-delta" style={{color:verdictColor}}>Δ {deltaStr}</span>
                </div>
              </div>
              <div className="util">
                <div className="util-head">
                  <span className="ctl-lbl">Utilization</span>
                  <span className="util-pct" style={{color:verdictColor}}>{Math.round(util)}%</span>
                </div>
                <div className="util-track">
                  <div className="util-fill" style={{width:`${Math.min(100,util)}%`,background:verdictColor}}></div>
                </div>
              </div>
            </div>

            {/* 2×2 stats */}
            <div className="stat-grid">
              <div className="stat"><span className="stat-l">SL / Contract</span><span className="stat-v">{f$(slDol)}</span></div>
              <div className="stat"><span className="stat-l">Point Value</span><span className="stat-v">{f$(pv)}</span></div>
              <div className="stat"><span className="stat-l">Exposure</span><span className="stat-v">{f$(contracts*slDol)}</span></div>
              <div className="stat"><span className="stat-l">Slippage</span><span className="stat-v" style={{color:deltaSlip.color}}>{deltaSlip.txt}</span></div>
            </div>
          </div>

          {/* RIGHT — ladder */}
          <div className="right-col">
            <div className="ladder-head">
              <span className="ladder-title">{instName} · Stop Loss Ladder</span>
              <span className="ladder-legend">
                <span className="lg"><span className="dot green"></span>Under</span>
                <span className="lg"><span className="dot red"></span>Over</span>
              </span>
            </div>
            <div className="ladder-cols">
              <span>SL Pts</span>
              <span className="r">SL $</span>
              <span className="r">Actual Risk</span>
              <span className="r">vs Target</span>
            </div>
            <div className="ladder-body" ref={tableRef}>
              {rows.map(({p,d,ar,slip})=>{
                const isCur=slNum>0&&Math.abs(p-slNum)<ptStep*0.51;
                const isFlash=flashRow===p;
                const si=slipInfo(slip);
                return(
                  <div key={p} className={`lrow${isCur?' cur':''}${isFlash?' flash':''}`} onClick={()=>handleRowClick(p)}>
                    <div className="lcol-pts">
                      <span className="pts">{fPts(p)}</span>
                      {isCur && <span className="your-stop">Your stop</span>}
                    </div>
                    <span className="lval">{f$(d)}</span>
                    <span className="lval risk">{f$(ar)}</span>
                    <span className="lval slip" style={{color:si.color}}>{si.txt}</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* ── FOOTER ── */}
        <div className="footer">
          <div className="foot-left">
            <span>{instr} {instName}</span>
            <span>SL {fPts(slNum)} pts · {f$(slDol)}</span>
            <span>Risk {f$(riskDol)}</span>
            <span style={{color:verdictColor,fontWeight:700}}>{verdictLabel} · {contracts} contracts</span>
          </div>
          <div className="foot-right" style={{position:'relative'}}>
            {showSettings && (
              <div className="overlay settings-ov">
                <div className="st-sec">
                  <div className="st-head">Risk</div>
                  <div className="st-row">
                    <span className="st-lbl">% of Balance</span>
                    <Toggle checked={riskMode==='percent'} onChange={v=>setRiskMode(v?'percent':'fixed')}/>
                  </div>
                </div>
                <div className="st-sec">
                  <div className="st-head">Preferences</div>
                  <div className="st-row"><span className="st-lbl">Remember Balance</span><Toggle checked={remBal}   onChange={setRemBal}/></div>
                  <div className="st-row"><span className="st-lbl">Remember Risk</span>   <Toggle checked={remRisk}  onChange={setRemRisk}/></div>
                  <div className="st-row"><span className="st-lbl">Remember Instrument</span><Toggle checked={remInstr} onChange={setRemInstr}/></div>
                </div>
                <div className="st-sec">
                  <div className="st-head">Appearance</div>
                  <div className="seg">
                    {['system','dark','light'].map(m=>(
                      <button key={m} className={`seg-btn${themeMode===m?' on':''}`} onClick={()=>setThemeMode(m)}>{m.toUpperCase()}</button>
                    ))}
                  </div>
                </div>
                <div className="st-sec">
                  <div className="st-foot">KiCaps v1.0 · Made for traders</div>
                </div>
              </div>
            )}
            <button data-ot="1" className={`foot-btn${showSettings?' active':''}`}
              onClick={()=>{ setShowSettings(v=>!v); setShowManage(false); }}>⚙ Settings</button>
            <button className="foot-btn" onClick={()=>setThemeMode(isDark?'light':'dark')}>
              {isDark?'◐ Light':'◑ Dark'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
